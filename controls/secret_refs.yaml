version: 1
mode: local-environment-fallback
secrets:
  JWT_SECRET:
    source: environment
    production_reference: azure-key-vault://afyaplus-prod/jwt-secret
    aws_reference: aws-kms-alias/afyaplus-prod + secrets-manager/afyaplus/jwt-secret
  AUDIT_HASH_SALT:
    source: environment
    production_reference: azure-key-vault://afyaplus-prod/audit-hash-salt
notes:
  - No secret values are stored in this file.
  - Cloud references are configuration artefacts only; no live cloud access is claimed.
